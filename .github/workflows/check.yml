name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Unit tests and non-mutating PF parser check
        run: swift run surge-guard-tests
      - name: Release build
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Confirm help and rule preview do not need privileges
        run: |
          .build/release/surge-guard --help
          .build/release/surge-guard install --help
          .build/release/surge-guard rules
          .build/release/surge-gate --help
          .build/release/surge-guard validate examples/enhanced.json
          .build/release/surge-guard validate examples/routes.json
          .build/release/surge-guard swiftbar --section
          sh -n scripts/install-user.sh
          sh -n integrations/swiftbar/surge-guard.5s.sh
          sh -n integrations/swiftbar/surge-guard-action.sh
          sh integrations/swiftbar/surge-guard-action.sh --help
      - name: Hosted runner has no Surge and must not report ready
        run: |
          if .build/release/surge-guard check; then
            echo 'Unexpected ready state on a runner without Surge'
            exit 1
          fi
